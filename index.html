<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monte Rosa Expedition Kit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-background: #f4f6f9;
            --color-surface: #ffffff;
            --color-primary: #2c3e50;
            --color-secondary: #34495e;
            --color-accent: #3498db;
            --color-text: #2c3e50;
            --color-text-light: #7f8c8d;
            --color-border: #ecf0f1;
            --color-essential: #2ecc71;
            --color-optional: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            overscroll-behavior-y: none;
            touch-action: manipulation;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--color-surface);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header {
            background-color: var(--color-primary);
            color: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .search-container {
            padding: 10px;
            background-color: var(--color-surface);
            position: sticky;
            top: 50px;
            z-index: 99;
        }

        #search-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 16px;
        }

        .category {
            margin-bottom: 5px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--color-background);
            cursor: pointer;
            user-select: none;
        }

        .category-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-secondary);
        }

        .category-header .toggle {
            font-size: 20px;
            color: var(--color-text-light);
        }

        .category-items {
            display: none;
        }

        .category-items.active {
            display: block;
        }

        .item {
            display: grid;
            grid-template-columns: 1fr 100px;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--color-border);
            gap: 15px;
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 16px;
            font-weight: 400;
        }

        .item-note {
            font-size: 12px;
            color: var(--color-text-light);
            margin-top: 5px;
        }

        .toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--color-text-light);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .checkbox-label {
            font-size: 10px;
            margin-top: 3px;
            color: var(--color-text-light);
        }

        .checkbox.checked {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        @media (max-width: 375px) {
            .item-name, .item-note {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monte Rosa Expedition Kit</h1>
        </div>

        <div class="search-container">
            <input type="search" id="search-input" placeholder="Search gear items...">
        </div>

        <div id="kit-list-categories"></div>
    </div>

    <script>
        const kitListCategories = [
            {
                name: "Key Clothing - Tops",
                items: [
                    { 
                        name: "Hard-shell waterproof shell jacket", 
                        note: "GORE‑TEX or similar, with hood",
                        recommended: "Jottnar 'Hodr', 'Grim' or 'Odin' hardshell"
                    },
                    { 
                        name: "Down or synthetic warm jacket", 
                        note: "Key insulating layer",
                        recommended: "Jottnar 'Asger' or 'Floyen' jackets"
                    },
                    { 
                        name: "Mid layers", 
                        note: "Fleece or softshell",
                        recommended: "Technical, comfortable layer"
                    },
                    { 
                        name: "Base layer tops (long sleeve)", 
                        note: "Lightweight, x2 recommended",
                        recommended: "Jottnar 'Svend' or 'Tyer'"
                    },
                    { 
                        name: "Base layer tops (short sleeve)", 
                        note: "First layer of system, x2 recommended",
                        recommended: "Look for anti-microbial treatment, Jottnar 'Ove' or 'Mar'"
                    },
                    { 
                        name: "Cotton T-shirts", 
                        note: "Optional, for town or rest days",
                        recommended: "Lightweight and comfortable"
                    }
                ]
            },
            {
                name: "Key Clothing - Bottoms",
                items: [
                    { 
                        name: "Hard-shell waterproof shell pants", 
                        note: "GORE‑TEX or similar, with side zips",
                        recommended: "Jottnar 'Valdyr' works well"
                    },
                    { 
                        name: "Soft-shell mountaineering / trekking pants", 
                        note: "You'll spend most time in these",
                        recommended: "Jottnar 'Valen' is ideal"
                    },
                    { 
                        name: "Base layer leggings", 
                        note: "Full leg, lightweight",
                        recommended: "Keeps you warm"
                    },
                    { 
                        name: "Shorts", 
                        note: "Optional, for warm days or indoors",
                        recommended: "Lightweight, quick-dry"
                    },
                    { 
                        name: "Underwear", 
                        note: "Comfortable, moisture-wicking",
                        recommended: "Technical, breathable material"
                    }
                ]
            },
            {
                name: "Footwear",
                items: [
                    { 
                        name: "Mountaineering Boots", 
                        note: "B2 or B3 graded (B2 recommended for agility)",
                        recommended: "Scarpa Ribelle works well"
                    },
                    { 
                        name: "Warm Socks", 
                        note: "Merino wool ideal",
                        recommended: "Multiple pairs, moisture-wicking"
                    },
                    { 
                        name: "Trail / Hiking Shoes", 
                        note: "Optional, for lower mountain and town",
                        recommended: "Comfortable, lightweight"
                    }
                ]
            }
        ];

        const categoryContainer = document.getElementById('kit-list-categories');
        const searchInput = document.getElementById('search-input');

        function renderCategories() {
            try {
                categoryContainer.innerHTML = '';
                kitListCategories.forEach((category, categoryIndex) => {
                    const categoryElement = document.createElement('div');
                    categoryElement.className = 'category';

                    const categoryHeader = document.createElement('div');
                    categoryHeader.className = 'category-header';
                    categoryHeader.innerHTML = `
                        <h2>${category.name}</h2>
                        <span class="toggle">▼</span>
                    `;

                    const categoryItems = document.createElement('div');
                    categoryItems.className = 'category-items';

                    category.items.forEach((item, itemIndex) => {
                        const itemElement = document.createElement('div');
                        itemElement.className = 'item';
                        itemElement.innerHTML = `
                            <div class="item-details">
                                <div class="item-name">${item.name}</div>
                                <div class="item-note">${item.note}</div>
                                <div class="item-note"><em>Recommended: ${item.recommended}</em></div>
                            </div>
                            <div class="toggle-container">
                                <div class="checkbox packed-checkbox" data-category="${categoryIndex}" data-item="${itemIndex}">
                                    <span class="checkbox-label">Packed</span>
                                </div>
                                <div class="checkbox buy-checkbox" data-category="${categoryIndex}" data-item="${itemIndex}">
                                    <span class="checkbox-label">To Buy</span>
                                </div>
                            </div>
                        `;
                        categoryItems.appendChild(itemElement);
                    });

                    categoryHeader.addEventListener('click', () => {
                        categoryItems.classList.toggle('active');
                        const toggle = categoryHeader.querySelector('.toggle');
                        toggle.textContent = categoryItems.classList.contains('active') ? '▲' : '▼';
                    });

                    categoryElement.appendChild(categoryHeader);
                    categoryElement.appendChild(categoryItems);
                    categoryContainer.appendChild(categoryElement);
                });

                setupEventListeners();
            } catch (renderError) {
                console.error('Render error:', renderError);
            }
        }

        function setupEventListeners() {
            try {
                document.querySelectorAll('.checkbox').forEach(checkbox => {
                    checkbox.addEventListener('click', (e) => {
                        checkbox.classList.toggle('checked');
                    });
                });

                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    document.querySelectorAll('.item').forEach(item => {
                        const itemName = item.querySelector('.item-name').textContent.toLowerCase();
                        const itemNote = item.querySelector('.item-note').textContent.toLowerCase();
                        item.style.display = (itemName.includes(searchTerm) || itemNote.includes(searchTerm)) ? 'grid' : 'none';
                    });
                });
            } catch (listenerError) {
                console.error('Event listener error:', listenerError);
            }
        }

        // Initial render
        renderCategories();
    </script>
</body>
</html>
