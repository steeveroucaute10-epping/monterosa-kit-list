    <title>Monte Rosa Expedition Kit</title>

            <input type="search" id="search-input" placeholder="Search gear items...">

        <div id="kit-list-categories"></div>

            </div>
        </div>

    <script>
        const kitListCategories = [
            {
                name: "Key Clothing - Tops",
                items: [
                    { name: "Hard-shell waterproof shell jacket (GORE‑TEX)", type: "essential" },
                    { name: "Down or synthetic warm jacket", type: "essential" },
                    { name: "Mid layers (fleece or similar)", type: "essential" },
                    { name: "Base layer tops (long sleeve) x2", type: "essential" },
                    { name: "Base layer tops (short sleeve) x2", type: "essential" },
                    { name: "Cotton T-shirts", type: "optional" }
                ]
            },
            {
                name: "Key Clothing - Bottoms",
                items: [
                    { name: "Hard-shell waterproof shell pants (GORE‑TEX)", type: "essential" },

                    { name: "Shorts", type: "optional" },
                    { name: "Underwear", type: "essential" }
                ]
            },
            {
                name: "Footwear",

                    { name: "Sunscreen SPF 50+", type: "essential" },
                    { name: "Lip balm SPF 30+", type: "essential" }

                        note: "Can be rented. Recommended: Black Diamond 'Raven' Ice Axe" 
                    },

                    { name: "Mobile phone", type: "essential" },
                    { name: "Sleeping bag liner", type: "essential" },
                    { name: "Snacks (bars, gels, dried fruit)", type: "essential" }
