<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monterosa Mountaineering Kit List</title>
    <style>
        :root {
            --primary-color: #1a5f7a;
            --secondary-color: #2c8eb3;
            --background-color: #f4f7f6;
            --text-color: #333;
            --accent-color: #e67e22;
            --priority-high: #e74c3c;
            --priority-medium: #f39c12;
            --priority-low: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            padding: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
        }

        .category {
            margin-bottom: 10px;
            border-bottom: 1px solid var(--background-color);
        }

        .category-title {
            background-color: var(--secondary-color);
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-toggle {
            cursor: pointer;
            user-select: none;
        }

        .category-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .category-content.collapsed {
            max-height: 0;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: white;
            transition: background-color 0.3s ease;
            border-bottom: 1px solid #f1f1f1;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-checkbox {
            margin-right: 15px;
        }

        .item-label {
            flex-grow: 1;
        }

        .priority-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .priority-high {
            background-color: var(--priority-high);
        }

        .priority-medium {
            background-color: var(--priority-medium);
        }

        .priority-low {
            background-color: var(--priority-low);
        }

        .item-actions {
            display: flex;
            align-items: center;
        }

        .purchase-toggle {
            display: flex;
            align-items: center;
            margin-left: 10px;
        }

        .custom-item-section {
            padding: 15px;
            background-color: var(--background-color);
        }

        .custom-item-input {
            display: flex;
            margin-top: 10px;
        }

        #custom-item-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }

        #add-custom-item {
            padding: 8px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        @media (max-width: 600px) {
            .item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-actions {
                width: 100%;
                justify-content: space-between;
                margin-top: 10px;
            }

            .purchase-toggle {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monterosa Mountaineering Kit List</h1>
        </div>

        <div id="kit-list-categories"></div>

        <div class="custom-item-section">
            <h2>Add Custom Item</h2>
            <div class="custom-item-input">
                <input type="text" id="custom-item-input" placeholder="Enter a new item">
                <button id="add-custom-item" onclick="addCustomItem()">Add Item</button>
            </div>
        </div>
    </div>

    <script>
        const kitListCategories = [
            {
                name: "Essential Clothing Layers",
                items: [
                    { name: "Base Layer - Thermal Underwear (Top)", priority: "high" },
                    { name: "Base Layer - Thermal Underwear (Bottom)", priority: "high" },
                    { name: "Mid Layer - Fleece/Softshell", priority: "high" },
                    { name: "Insulating Jacket (Down/Synthetic)", priority: "high" },
                    { name: "Hardshell Waterproof Jacket (GORE-TEX)", priority: "high" },
                    { name: "Hardshell Waterproof Pants", priority: "high" },
                    { name: "Lightweight Insulating Vest", priority: "medium" }
                ]
            },
            {
                name: "Technical Mountaineering Gear",
                items: [
                    { name: "Alpine Climbing Harness", priority: "high" },
                    { name: "Climbing Helmet", priority: "high" },
                    { name: "Ice Axe", priority: "high" },
                    { name: "Crampons (12-point steel)", priority: "high" },
                    { name: "Locking Carabiners (x2)", priority: "high" },
                    { name: "Mountaineering Backpack (30-40L)", priority: "high" },
                    { name: "Collapsible Trekking Poles", priority: "medium" }
                ]
            },
            {
                name: "Personal Protection",
                items: [
                    { name: "Warm Hat", priority: "high" },
                    { name: "Sun Hat", priority: "medium" },
                    { name: "Sunglasses (Cat. 4 with Side Covers)", priority: "high" },
                    { name: "Ski Goggles", priority: "medium" },
                    { name: "Thin Softshell Gloves", priority: "high" },
                    { name: "Thick Warm Expedition Gloves", priority: "high" },
                    { name: "Sunscreen SPF 50+", priority: "high" },
                    { name: "Lip Balm SPF 30+", priority: "high" }
                ]
            },
            {
                name: "Footwear and Accessories",
                items: [
                    { name: "B2/B3 Mountaineering Boots", priority: "high" },
                    { name: "Merino Wool Socks (Multiple Pairs)", priority: "high" },
                    { name: "Trail/Hiking Shoes", priority: "low" },
                    { name: "Gaiters", priority: "medium" }
                ]
            },
            {
                name: "Safety and Emergency Equipment",
                items: [
                    { name: "First Aid Kit", priority: "high" },
                    { name: "Emergency Shelter/Bivy Bag", priority: "high" },
                    { name: "Headlamp with Spare Batteries", priority: "high" },
                    { name: "Emergency Communication Device", priority: "high" },
                    { name: "Whistle", priority: "medium" },
                    { name: "Multi-tool", priority: "medium" }
                ]
            },
            {
                name: "Additional Accessories",
                items: [
                    { name: "Water Bottles (x2)", priority: "high" },
                    { name: "Hydration System", priority: "medium" },
                    { name: "Energy Bars/Gels", priority: "high" },
                    { name: "Compact Camera", priority: "low" },
                    { name: "Mobile Phone", priority: "medium" },
                    { name: "Sleeping Bag Liner", priority: "medium" }
                ]
            }
        ];

        function renderKitList() {
            const kitListContainer = document.getElementById('kit-list-categories');
            kitListContainer.innerHTML = '';

            kitListCategories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category';
                
                const categoryTitleElement = document.createElement('div');
                categoryTitleElement.className = 'category-title';
                
                const titleTextElement = document.createElement('span');
                titleTextElement.textContent = category.name;
                
                const toggleElement = document.createElement('span');
                toggleElement.textContent = '▼';
                toggleElement.className = 'category-toggle';
                
                categoryTitleElement.appendChild(titleTextElement);
                categoryTitleElement.appendChild(toggleElement);
                categoryElement.appendChild(categoryTitleElement);

                const contentElement = document.createElement('div');
                contentElement.className = 'category-content';

                category.items.forEach(item => {
                    const itemElement = createItemElement(item);
                    contentElement.appendChild(itemElement);
                });

                categoryElement.appendChild(contentElement);
                kitListContainer.appendChild(categoryElement);

                // Toggle functionality
                categoryTitleElement.addEventListener('click', () => {
                    contentElement.classList.toggle('collapsed');
                    toggleElement.textContent = contentElement.classList.contains('collapsed') ? '▶' : '▼';
                });
            });
        }

        function createItemElement(itemData) {
            const itemElement = document.createElement('div');
            itemElement.className = 'item';

            const checkboxId = itemData.name.toLowerCase().replace(/\s+/g, '-');

            const priorityClass = `priority-${itemData.priority}`;
            const priorityIndicator = `<div class="priority-indicator ${priorityClass}"></div>`;

            itemElement.innerHTML = `
                ${priorityIndicator}
                <input type="checkbox" id="${checkboxId}" class="item-checkbox">
                <label for="${checkboxId}" class="item-label">${itemData.name}</label>
                <div class="item-actions">
                    <div class="purchase-toggle">
                        <input type="checkbox" id="${checkboxId}-purchase" class="purchase-check">
                        <label for="${checkboxId}-purchase">Need to Buy</label>
                    </div>
                </div>
            `;

            return itemElement;
        }

        function addCustomItem() {
            const customItemInput = document.getElementById('custom-item-input');
            const itemName = customItemInput.value.trim();
            
            if (itemName) {
                const kitListContainer = document.getElementById('kit-list-categories');
                const customCategory = kitListContainer.querySelector('.category:last-child');
                
                if (!customCategory || customCategory.querySelector('.category-title span').textContent !== 'Custom Items') {
                    const newCustomCategory = document.createElement('div');
                    newCustomCategory.className = 'category';
                    
                    const categoryTitleElement = document.createElement('div');
                    categoryTitleElement.className = 'category-title';
                    
                    const titleTextElement = document.createElement('span');
                    titleTextElement.textContent = 'Custom Items';
                    
                    const toggleElement = document.createElement('span');
                    toggleElement.textContent = '▼';
                    toggleElement.className = 'category-toggle';
                    
                    categoryTitleElement.appendChild(titleTextElement);
                    categoryTitleElement.appendChild(toggleElement);
                    newCustomCategory.appendChild(categoryTitleElement);
                    
                    const contentElement = document.createElement('div');
                    contentElement.className = 'category-content';
                    newCustomCategory.appendChild(contentElement);
                    
                    kitListContainer.appendChild(newCustomCategory);

                    // Toggle functionality for custom category
                    categoryTitleElement.addEventListener('click', () => {
                        contentElement.classList.toggle('collapsed');
                        toggleElement.textContent = contentElement.classList.contains('collapsed') ? '▶' : '▼';
                    });
                }

                const customItemData = { name: itemName, priority: "low" };
                const itemElement = createItemElement(customItemData);
                kitListContainer.lastChild.querySelector('.category-content').appendChild(itemElement);
                
                customItemInput.value = '';
            }
        }

        // Initial render
        renderKitList();
    </script>
</body>
</html>
