<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monterosa Expedition Kit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* [Previous CSS remains unchanged] */
    </style>
</head>
<body>
    <div id="error-display" style="color: red; background-color: #ffeeee; padding: 10px; display: none;">
        An error occurred while loading the page. Please check the console.
    </div>

    <div class="container">
        <!-- [Previous HTML body remains unchanged] -->
    </div>

    <script>
        // Add error handling
        window.addEventListener('error', function(event) {
            console.error('Unhandled error:', event.error);
            document.getElementById('error-display').style.display = 'block';
        });

        try {
            const kitListCategories = [
                // [Previous kitListCategories remain unchanged]
            ];

            const categoryContainer = document.getElementById('kit-list-categories');
            const searchInput = document.getElementById('search-input');
            const customItemInput = document.getElementById('custom-item-input');
            const addCustomItemButton = document.getElementById('add-custom-item');

            function renderCategories() {
                try {
                    categoryContainer.innerHTML = '';
                    kitListCategories.forEach((category, categoryIndex) => {
                        const categoryElement = document.createElement('div');
                        categoryElement.className = 'category';

                        const categoryHeader = document.createElement('div');
                        categoryHeader.className = 'category-header';
                        categoryHeader.innerHTML = `
                            <h2>${category.name}</h2>
                            <span class="toggle">▼</span>
                        `;

                        const categoryItems = document.createElement('div');
                        categoryItems.className = 'category-items';

                        category.items.forEach((item, itemIndex) => {
                            const itemElement = document.createElement('div');
                            itemElement.className = 'item';
                            itemElement.innerHTML = `
                                <div class="item-type-indicator ${item.type}"></div>
                                <div class="item-name">${item.name}</div>
                                <div class="checkbox" data-category="${categoryIndex}" data-item="${itemIndex}"></div>
                                <div class="purchase-checkbox" data-category="${categoryIndex}" data-item="${itemIndex}"></div>
                            `;
                            categoryItems.appendChild(itemElement);
                        });

                        categoryHeader.addEventListener('click', () => {
                            categoryItems.classList.toggle('active');
                            const toggle = categoryHeader.querySelector('.toggle');
                            toggle.textContent = categoryItems.classList.contains('active') ? '▲' : '▼';
                        });

                        categoryElement.appendChild(categoryHeader);
                        categoryElement.appendChild(categoryItems);
                        categoryContainer.appendChild(categoryElement);
                    });

                    setupEventListeners();
                } catch (renderError) {
                    console.error('Render error:', renderError);
                    document.getElementById('error-display').style.display = 'block';
                }
            }

            function setupEventListeners() {
                try {
                    document.querySelectorAll('.checkbox, .purchase-checkbox').forEach(checkbox => {
                        checkbox.addEventListener('click', (e) => {
                            checkbox.classList.toggle('checked');
                        });
                    });

                    searchInput.addEventListener('input', (e) => {
                        const searchTerm = e.target.value.toLowerCase();
                        document.querySelectorAll('.item').forEach(item => {
                            const itemName = item.querySelector('.item-name').textContent.toLowerCase();
                            item.style.display = itemName.includes(searchTerm) ? 'grid' : 'none';
                        });
                    });

                    addCustomItemButton.addEventListener('click', () => {
                        const itemName = customItemInput.value.trim();
                        if (itemName) {
                            let customCategory = kitListCategories.find(cat => cat.name === 'Custom Items');
                            if (!customCategory) {
                                customCategory = { name: 'Custom Items', items: [] };
                                kitListCategories.push(customCategory);
                            }

                            customCategory.items.push({ name: itemName, type: 'optional' });
                            renderCategories();
                            customItemInput.value = '';
                        }
                    });
                } catch (listenerError) {
                    console.error('Event listener error:', listenerError);
                    document.getElementById('error-display').style.display = 'block';
                }
            }

            // Initial render
            renderCategories();
        } catch (mainError) {
            console.error('Main script error:', mainError);
            document.getElementById('error-display').style.display = 'block';
        }
    </script>
</body>
</html>
