<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monterosa Expedition Kit List</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --background-color: #ecf0f1;
            --text-color: #333;
            --accent-color: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            padding: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
        }

        .category {
            margin-bottom: 10px;
            border-bottom: 1px solid var(--background-color);
        }

        .category-title {
            background-color: var(--secondary-color);
            color: white;
            padding: 10px 15px;
            font-weight: bold;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: white;
            transition: background-color 0.3s ease;
        }

        .item:hover {
            background-color: #f9f9f9;
        }

        .item-checkbox {
            margin-right: 15px;
        }

        .item-label {
            flex-grow: 1;
        }

        .item-actions {
            display: flex;
            align-items: center;
        }

        .purchase-toggle {
            display: flex;
            align-items: center;
            margin-left: 10px;
        }

        .custom-item-section {
            padding: 15px;
            background-color: var(--background-color);
        }

        .custom-item-input {
            display: flex;
            margin-top: 10px;
        }

        #custom-item-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }

        #add-custom-item {
            padding: 8px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #add-custom-item:hover {
            background-color: #2980b9;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            overflow-y: auto;
        }

        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--secondary-color);
        }

        .recommendation {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-actions {
                width: 100%;
                justify-content: space-between;
                margin-top: 10px;
            }

            .purchase-toggle {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monterosa Expedition Kit List</h1>
        </div>

        <!-- Categories will be dynamically populated here -->
        <div id="kit-list-categories"></div>

        <div class="custom-item-section">
            <h2>Add Custom Item</h2>
            <div class="custom-item-input">
                <input type="text" id="custom-item-input" placeholder="Enter a new item">
                <button id="add-custom-item" onclick="addCustomItem()">Add Item</button>
            </div>
        </div>
    </div>

    <div id="recommendationsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Purchase Recommendations</h2>
            <div id="recommendationsList"></div>
        </div>
    </div>

    <script>
        // Kit list categories and items
        const kitListCategories = [
            {
                name: "Tops",
                items: [
                    "Hardshell Waterproof Jacket (GORE-TEX)",
                    "Down/Synthetic Warm Jacket",
                    "Mid Layer (Fleece/Softshell)",
                    "Base Layer - Long Sleeve (x2)",
                    "Base Layer - Short Sleeve (x2)",
                    "Cotton T-shirts"
                ]
            },
            {
                name: "Bottoms",
                items: [
                    "Mountain Equipment Makalu Hardshell Pants",
                    "Soft-shell Mountaineering / Trekking Pants",
                    "Base Layer Leggings",
                    "Shorts",
                    "Underwear"
                ]
            },
            // Add other categories similarly
        ];

        function renderKitList() {
            const kitListContainer = document.getElementById('kit-list-categories');
            kitListContainer.innerHTML = '';

            kitListCategories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category';
                
                const categoryTitleElement = document.createElement('div');
                categoryTitleElement.className = 'category-title';
                categoryTitleElement.textContent = category.name;
                categoryElement.appendChild(categoryTitleElement);

                category.items.forEach(itemName => {
                    const itemElement = createItemElement(itemName);
                    categoryElement.appendChild(itemElement);
                });

                kitListContainer.appendChild(categoryElement);
            });
        }

        function createItemElement(itemName) {
            const itemElement = document.createElement('div');
            itemElement.className = 'item';

            const checkboxId = itemName.toLowerCase().replace(/\s+/g, '-');

            itemElement.innerHTML = `
                <input type="checkbox" id="${checkboxId}" class="item-checkbox">
                <label for="${checkboxId}" class="item-label">${itemName}</label>
                <div class="item-actions">
                    <div class="purchase-toggle">
                        <input type="checkbox" id="${checkboxId}-purchase" class="purchase-check">
                        <label for="${checkboxId}-purchase">Need to Buy</label>
                    </div>
                </div>
            `;

            return itemElement;
        }

        function addCustomItem() {
            const customItemInput = document.getElementById('custom-item-input');
            const itemName = customItemInput.value.trim();
            
            if (itemName) {
                const kitListContainer = document.getElementById('kit-list-categories');
                const customCategory = kitListContainer.querySelector('.category:last-child');
                
                if (!customCategory || customCategory.querySelector('.category-title').textContent !== 'Custom Items') {
                    const newCustomCategory = document.createElement('div');
                    newCustomCategory.className = 'category';
                    
                    const categoryTitleElement = document.createElement('div');
                    categoryTitleElement.className = 'category-title';
                    categoryTitleElement.textContent = 'Custom Items';
                    newCustomCategory.appendChild(categoryTitleElement);
                    
                    kitListContainer.appendChild(newCustomCategory);
                }

                const itemElement = createItemElement(itemName);
                kitListContainer.lastChild.appendChild(itemElement);
                
                customItemInput.value = '';
            }
        }

        // Initial render
        renderKitList();
    </script>
</body>
</html>
